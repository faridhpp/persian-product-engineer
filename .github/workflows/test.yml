name: Validate Skill Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate structure
        run: node tests/validate-structure.js
